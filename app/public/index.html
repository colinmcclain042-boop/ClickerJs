.mainClickButton {
  width: 180px;
  height: 230px;

  padding: 0;

  border: 4px solid #777;
  border-radius: 48% 48% 42% 42%;

  background:
    linear-gradient(
      to right,
      #d4cec0 0%,
      #c4bdaf 48%,
      #aaa396 100%
    );

  box-shadow:
    0 8px 0 #666,
    0 12px 20px rgba(0, 0, 0, 0.45);

  color: #222;

  font-size: 64px;

  cursor: pointer;

  position: relative;

  transition:
    transform 0.06s ease,
    box-shadow 0.06s ease;

  outline: none;
}


/* Split between left and right buttons */

.mainClickButton::before {
  content: "";

  position: absolute;

  top: 5px;
  left: 50%;

  transform: translateX(-50%);

  width: 3px;
  height: 105px;

  background: #888;

  border-radius: 2px;
}


/* Scroll wheel */

.mainClickButton::after {
  content: "";

  position: absolute;

  top: 24px;
  left: 50%;

  transform: translateX(-50%);

  width: 21px;
  height: 38px;

  background: #777;

  border: 2px solid #666;

  border-radius: 10px;

  box-shadow:
    inset 0 2px 2px rgba(255, 255, 255, 0.4),
    0 2px 3px rgba(0, 0, 0, 0.3);
}


/* Mouse press */

.mainClickButton:active {
  transform: translateY(7px);

  box-shadow:
    0 1px 0 #666,
    0 4px 8px rgba(0, 0, 0, 0.4);
}





    /* Pressed state */

    .loadingFill {

          90deg,
          #59a85b 0px,

        );

      position: relative;

      transition: width 0.08s linear;

      overflow: hidden;
    }


    /* Moving light across the loading bar */

    .loadingFill::after {
      content: "";

      position: absolute;

      top: 0;
      left: -40%;

      width: 40%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,

      );

      animation: loadingSweep 1.2s linear infinite;

      to {

    /* =========================================================
      RETRO CRT MONITOR
      ========================================================= */

    html,
    body {
      min-height: 100%;
    }


    body {
      margin: 0;
      padding: 45px 20px;

      background:
        radial-gradient(
          ellipse at center,
          #45433d 0%,
          #24231f 55%,
          #11110f 100%
        );

      box-sizing: border-box;
    }


    /* CRT cabinet / screen */

    .clickerWindow {
      width: min(900px, 90vw);

      margin: 0 auto;

      padding: 35px 40px 45px;

      box-sizing: border-box;

      background:
        radial-gradient(
          ellipse at center,
          #102010 0%,
          #071007 65%,
          #040804 100%
        );

      border: 22px solid #c9c3b6;

      border-radius: 28px;

      box-shadow:
        0 7px 0 #8c877d,
        0 18px 35px rgba(0, 0, 0, 0.65),

        inset 0 0 35px rgba(0, 0, 0, 0.9),
        inset 0 0 8px rgba(110, 220, 120, 0.25);

      position: relative;

      overflow: hidden;
    }


    /* Inner CRT glass edge */

    .clickerWindow::before {
      content: "";

      position: absolute;

      inset: 7px;

      border: 2px solid rgba(150, 145, 135, 0.35);

      border-radius: 17px;

      pointer-events: none;

      box-shadow:
        inset 0 0 20px rgba(0, 0, 0, 0.75);
    }


    /* Keep game content above the CRT edge */

    .clickerWindow > * {
      position: relative;
      z-index: 1;
    }

  /* =========================================================
    ESCALATING CRT GLITCH EFFECTS
    These effects stay inside the monitor's screen area.
    ========================================================= */

  .clickerWindow {
    --glitch-color: #8ee091;
  }

  /* Screen flicker and scanline overlay */
  .clickerWindow::after {
    content: "";
    position: absolute;
    inset: 22px;
    border-radius: 8px;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0, 0, 0, 0.22) 4px
    );
  }

  /* STAGE 1: INSTABILITY */
  .clickerWindow.glitchStage1::after {
    opacity: 0.25;
    animation: glitchFlicker1 0.8s steps(2, end) infinite;
  }

  .clickerWindow.glitchStage1 .systemStatus {
    color: #ffe66d;
    animation: warningPulse1 1s ease-in-out infinite;
  }

  /* STAGE 2: CRITICAL FAILURE */
  .clickerWindow.glitchStage2::after {
    opacity: 0.55;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.35) 4px
      ),
      linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 0, 0, 0.12) 50%,
        transparent 100%
      );
    animation: glitchFlicker2 0.35s steps(2, end) infinite;
  }

  .clickerWindow.glitchStage2 .systemStatus {
    color: #ff5656;
    text-shadow: 2px 0 #ff0000, -2px 0 #00ffff;
    animation: warningPulse2 0.45s steps(2, end) infinite;
  }

  /* STAGE 3: SYSTEM OVERLOAD */
  .clickerWindow.glitchStage3::after {
    opacity: 0.8;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        rgba(255, 0, 0, 0.12) 2px,
        transparent 4px,
        rgba(0, 255, 255, 0.12) 6px
      );
    animation: glitchFlicker3 0.18s steps(2, end) infinite;
  }

  .clickerWindow.glitchStage3 .systemStatus {
    color: #ff3333;
    text-shadow: 3px 0 #ff0000, -3px 0 #00ffff;
    animation: warningPulse3 0.25s steps(2, end) infinite;
  }

  .clickerWindow.glitchStage3 h1 {
    animation: titleDistortion 0.3s steps(2, end) infinite;
  }

  /* Animations */
  @keyframes glitchFlicker1 {
    0%, 100% { opacity: 0.12; }
    50% { opacity: 0.35; }
  }

  @keyframes glitchFlicker2 {
    0%, 100% { opacity: 0.25; }
    25% { opacity: 0.75; }
    50% { opacity: 0.4; }
    75% { opacity: 0.9; }
  }

  @keyframes glitchFlicker3 {
    0%, 100% { opacity: 0.45; }
    20% { opacity: 0.95; }
    40% { opacity: 0.3; }
    60% { opacity: 0.85; }
    80% { opacity: 0.55; }
  }

  @keyframes warningPulse1 {
    50% { text-shadow: 0 0 8px #ffe66d; }
  }

  @keyframes warningPulse2 {
    50% { text-shadow: 3px 0 red, -3px 0 cyan, 0 0 12px red; }
  }

  @keyframes warningPulse3 {
    50% { text-shadow: 4px 0 red, -4px 0 cyan, 0 0 18px red; }
  }

  @keyframes titleDistortion {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(2px); }
    50% { transform: translateX(-2px); }
    75% { transform: translateX(1px); }
  }
